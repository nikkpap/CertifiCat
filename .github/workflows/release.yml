# Αυτόματο release για το OTA του CertifiCat.
# Ενεργοποιείται με push ενός tag vX.Y.Z — χρησιμοποιεί ΜΟΝΟ το ενσωματωμένο GITHUB_TOKEN (κανένα secret).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version & build checksum
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          FILE=$(ls CertifiCat_v*.pyw | head -n1)
          echo "File: $FILE  Tag: $GITHUB_REF_NAME"
          grep -q "APP_VERSION = \"$VER\"" "$FILE" || { echo "::error::APP_VERSION in $FILE does not match tag $GITHUB_REF_NAME"; exit 1; }
          python3 -m py_compile "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256" \
            --title "CertifiCat ${GITHUB_REF_NAME#v}" --latest "${ARGS[@]}"
