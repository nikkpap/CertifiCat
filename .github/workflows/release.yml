# Αυτόματο release για το OTA του CertifiCat.
# Τρέχει όταν αλλάζει το app στο main (ή χειροκίνητα / με tag). Διαβάζει το APP_VERSION από το .pyw και,
# αν δεν υπάρχει ήδη release vX.Y.Z, φτιάχνει tag + release με .pyw και .sha256.
# Χρησιμοποιεί ΜΟΝΟ το ενσωματωμένο GITHUB_TOKEN — κανένα secret στο repo.
name: Release

on:
  push:
    branches: [main]
    paths: ["CertifiCat_v*.pyw", "release-notes/**", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version & build checksum
        id: v
        run: |
          set -euo pipefail
          FILE=$(ls CertifiCat_v*.pyw | head -n1)
          VER=$(grep -m1 -oP '^APP_VERSION = "\K[0-9.]+' "$FILE")
          TAG="v$VER"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match APP_VERSION $VER"; exit 1
          fi
          python3 -m py_compile "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"
          cat "$FILE.sha256"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "ver=$VER"   >> "$GITHUB_OUTPUT"

      - name: Publish release (if new version)
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.v.outputs.file }}
          TAG: ${{ steps.v.outputs.tag }}
          VER: ${{ steps.v.outputs.ver }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — nothing to do."; exit 0
          fi
          NOTES="release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then ARGS=(--notes-file "$NOTES"); else ARGS=(--generate-notes); fi
          gh release create "$TAG" "$FILE" "$FILE.sha256" --target "$GITHUB_SHA" \
            --title "CertifiCat $VER" --latest "${ARGS[@]}"
          echo "Published $TAG"
